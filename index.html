<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anthrogen: Biological Abundance</title>
<meta name="description" content="Anthrogen, a zine published by Onto.">
<link rel="preload" as="image" href="pages/01.webp">
<style>
  :root {
    --stage: #110e0c;   /* the zine's warm black */
    --paper: #f4f3ec;
    --lime: #b8d13f;
    --controls: 64px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--stage);
    color: var(--paper);
    font: 15px/1.4 "FK Roman Standard", "Times New Roman", Times, serif;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    -webkit-font-smoothing: antialiased;
  }

  /* Book mode */
  .book-mode { height: 100%; display: grid; grid-template-rows: 1fr var(--controls); }
  #book {
    position: relative; min-height: 0; overflow: hidden;
    opacity: 0; transition: opacity .6s ease;
  }
  #book.ready { opacity: 1; }
  #book canvas {
    display: block; width: 100% !important; height: 100% !important;
    object-fit: contain; touch-action: pan-y;
  }
  #book canvas.go-back { cursor: w-resize; }
  #book canvas.go-on { cursor: e-resize; }

  .controls {
    display: flex; align-items: center; justify-content: center; gap: 20px;
    padding-bottom: 8px;
  }
  .controls button {
    appearance: none; background: none; border: 0; color: inherit;
    width: 44px; height: 44px; padding: 0; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; opacity: .7;
    transition: opacity .2s;
  }
  .controls button:hover:not(:disabled) { opacity: 1; }
  .controls button:disabled { opacity: .18; cursor: default; }
  .controls button:focus-visible { outline: 1px solid var(--lime); outline-offset: 2px; }
  .controls svg { width: 22px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1; }
  #where {
    min-width: 7.5em; text-align: center; opacity: .6;
    font-variant-numeric: lining-nums tabular-nums;
  }

  /* Phone mode: the pages in reading order, one under the next */
  .column-mode #book, .column-mode .controls { display: none; }
  #column { display: none; }
  .column-mode #column {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 14px 14px 40px;
  }
  #column img {
    display: block; width: 100%; max-width: 560px; height: auto;
    background: #fff; aspect-ratio: var(--ratio);
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  #error { display: none; position: fixed; inset: auto 0 80px; text-align: center; opacity: .8; }
</style>
</head>
<body>
  <main id="app" class="book-mode">
    <div id="book" role="img" aria-label="Anthrogen zine, cover"></div>
    <nav class="controls" aria-label="Pages">
      <button id="prev" type="button" aria-label="Previous spread" disabled>
        <svg viewBox="0 0 22 12" aria-hidden="true"><path d="M21 6H1M6 1 1 6l5 5"/></svg>
      </button>
      <span id="where" aria-live="polite">Cover</span>
      <button id="next" type="button" aria-label="Next spread">
        <svg viewBox="0 0 22 12" aria-hidden="true"><path d="M1 6h20M16 1l5 5-5 5"/></svg>
      </button>
    </nav>
    <div id="column" aria-label="Anthrogen zine, all pages"></div>
  </main>
  <p id="error" role="alert">The pages didn’t load. Reload the page to try again.</p>

  <script src="pages/pages.js"></script>
  <script src="vendor/flipbook-viewer.js"></script>
  <script>
  (() => {
    'use strict';
    const PAGES = window.ZINE_PAGES;            // book order, from tools/render_pages.py
    const LAST_SPREAD = Math.floor(PAGES.length / 2);
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const phone = matchMedia('(max-width: 700px) and (orientation: portrait)');

    const app = document.getElementById('app');
    const bookEl = document.getElementById('book');
    const where = document.getElementById('where');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    /* ---------- images: load once, in reading order, shared by both modes ---------- */
    const store = PAGES.map(() => ({ state: 'idle', img: null, waiting: [] }));

    function load(i) {                         // i is 0-based
      const s = store[i];
      if (s.state !== 'idle') return;
      s.state = 'loading';
      const img = new Image();
      img.decoding = 'async';
      img.onload = () => {
        s.state = 'ready';
        s.img = { img, num: i + 1, width: img.naturalWidth, height: img.naturalHeight };
        s.waiting.splice(0).forEach(cb => cb(null, s.img));
        pump();
      };
      img.onerror = () => {
        s.state = 'failed';
        document.getElementById('error').style.display = 'block';
        s.waiting.splice(0).forEach(cb => cb('Failed to load ' + PAGES[i].src));
        pump();
      };
      img.src = PAGES[i].src;
    }

    // Background preloading, a few at a time, front to back.
    let cursor = 0;
    function pump() {
      const busy = store.filter(s => s.state === 'loading').length;
      for (let n = busy; n < 3 && cursor < store.length; cursor++) {
        if (store[cursor].state === 'idle') { load(cursor); n++; }
      }
    }

    // The "book provider" flipbook-viewer expects. Page numbers are 1-based;
    // 0 or past the end means "no page" (empty side of the first/last spread).
    const book = {
      numPages: () => PAGES.length,
      getPage(n, cb) {
        if (!n || n > PAGES.length) return cb();
        const s = store[n - 1];
        if (s.state === 'ready') return cb(null, s.img);
        if (s.state === 'failed') return cb('Failed to load ' + PAGES[n - 1].src);
        if (s.waiting.length < 50) s.waiting.push(cb);
        load(n - 1);
      },
    };

    /* ---------- labels ---------- */
    function label(spread) {
      if (spread === 0) return 'Cover';
      if (spread === LAST_SPREAD) return 'Back cover';
      const nums = [PAGES[spread * 2 - 1], PAGES[spread * 2]]
        .filter(p => p && typeof p.page === 'number').map(p => p.page);
      return nums.length === 2 ? `pp. ${nums[0]}–${nums[1]}` : `p. ${nums[0]}`;
    }

    /* ---------- book mode ---------- */
    let viewer = null, spread = 0, building = false;

    function setSpread(s) {
      spread = s;
      const text = label(s);
      where.textContent = text;
      bookEl.setAttribute('aria-label', 'Anthrogen zine, ' + text);
      prevBtn.disabled = s === 0;
      nextBtn.disabled = s === LAST_SPREAD;
    }

    const frame = () => new Promise(r => requestAnimationFrame(r));

    let jumping = false;
    async function goTo(target) {                // jump without the page-turn animation
      if (jumping) return;
      jumping = true;
      window.FLIP_MS = 1;
      for (let guard = 0; spread !== target && guard < 400; guard++) {
        const before = spread;
        target > spread ? viewer.flip_forward() : viewer.flip_back();
        for (let w = 0; spread === before && w < 300; w++) await frame();
      }
      window.FLIP_MS = reduced.matches ? 1 : null;
      jumping = false;
    }

    function buildBook(startAt) {
      building = true;
      bookEl.classList.remove('ready');
      bookEl.innerHTML = '';
      const r = bookEl.getBoundingClientRect();
      window.FLIP_MS = reduced.matches ? 1 : null;
      flipbook.init(book, 'book', {
        width: Math.max(320, Math.floor(r.width)),
        height: Math.max(240, Math.floor(r.height)),
        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--stage').trim(),
        margin: 3,
      }, async (err, v) => {
        if (err) { console.error(err); document.getElementById('error').style.display = 'block'; return; }
        viewer = v;
        spread = 0;
        viewer.on('seen', n => setSpread(Math.floor(Number(n) / 2)));
        setSpread(0);
        if (startAt) await goTo(startAt);
        bookEl.classList.add('ready');
        building = false;
        wireCanvas();
        pump();
      });
    }

    function wireCanvas() {
      const canvas = bookEl.querySelector('canvas');
      if (!canvas) return;
      const side = e => {
        const r = canvas.getBoundingClientRect();
        return e.clientX < r.left + r.width / 2 ? -1 : 1;
      };
      canvas.addEventListener('mousemove', e => {
        const s = side(e);
        canvas.classList.toggle('go-back', s < 0 && spread > 0);
        canvas.classList.toggle('go-on', s > 0 && spread < LAST_SPREAD);
      });
      canvas.addEventListener('click', e => turn(side(e)));
      let x0 = null, y0 = null;
      canvas.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
      canvas.addEventListener('touchend', e => {
        if (x0 == null) return;
        const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
        x0 = null;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) turn(dx < 0 ? 1 : -1);
      });
    }

    function turn(dir) {
      if (!viewer || building || jumping) return;
      dir > 0 ? viewer.flip_forward() : viewer.flip_back();
    }

    prevBtn.addEventListener('click', () => turn(-1));
    nextBtn.addEventListener('click', () => turn(1));
    document.addEventListener('keydown', e => {
      if (app.classList.contains('column-mode') || e.metaKey || e.ctrlKey || e.altKey) return;
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); turn(1); }
      else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); turn(-1); }
      else if (e.key === 'Home' && viewer && !building && !jumping) { e.preventDefault(); goTo(0); }
      else if (e.key === 'End' && viewer && !building && !jumping) { e.preventDefault(); goTo(LAST_SPREAD); }
    });

    /* ---------- phone mode ---------- */
    let columnBuilt = false;
    function buildColumn() {
      if (columnBuilt) return;
      columnBuilt = true;
      const col = document.getElementById('column');
      PAGES.forEach((p, i) => {
        if (p.page === 'blank') return;       // the blank inside covers
        const img = document.createElement('img');
        img.loading = i < 3 ? 'eager' : 'lazy';
        img.decoding = 'async';
        img.src = p.src;
        img.alt = p.page === 'front' ? 'Front cover: Biological Abundance'
                : p.page === 'back' ? 'Back cover' : `Page ${p.page}`;
        img.style.setProperty('--ratio', '1477 / 2080');
        img.dataset.spread = Math.floor((i + 1) / 2);
        img.onload = () => img.style.setProperty('--ratio', `${img.naturalWidth} / ${img.naturalHeight}`);
        col.appendChild(img);
      });
    }

    function columnSpread() {                 // which spread is on screen in phone mode
      const imgs = [...document.querySelectorAll('#column img')];
      const mid = innerHeight / 2;
      const hit = imgs.find(im => { const r = im.getBoundingClientRect(); return r.top <= mid && r.bottom >= mid; });
      return hit ? Number(hit.dataset.spread) : spread;
    }

    /* ---------- choose a mode, and rebuild on resize ---------- */
    let mode = null;
    function layout() {
      const want = phone.matches ? 'column' : 'book';
      if (want === mode && want === 'column') return;
      const keep = mode === 'column' ? columnSpread() : spread;
      mode = want;
      app.className = want + '-mode';
      if (want === 'column') {
        buildColumn();
        const target = document.querySelector(`#column img[data-spread="${keep}"]`);
        if (target && keep) target.scrollIntoView();
      } else {
        buildBook(keep);
      }
    }

    let t;
    addEventListener('resize', () => { clearTimeout(t); t = setTimeout(layout, 250); });
    reduced.addEventListener?.('change', () => { window.FLIP_MS = reduced.matches ? 1 : null; });

    load(0); load(1); load(2);
    layout();
  })();
  </script>
</body>
</html>
